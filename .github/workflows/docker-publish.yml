name: Build Nightly

on:
  schedule:
    - cron: '25 7 * * 1-6' # Every weekday at 1:25 AM CST/7:25 AM UTC
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag of the Docker images'
        required: false
        default: nightly

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        package: [Dashboard Common, Purchasing Dashboard, Dashboard Data API]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv and dev dependencies
        working-directory: ./${{ matrix.package }}
        run: |
          pip install uv
          uv sync --dev

      - name: Run tests
        working-directory: ./${{ matrix.package }}
        run: uv run pytest

  build-and-push:
    name: Build & Push Docker Images
    needs: [test]
    runs-on: ubuntu-latest

    steps:
      - name: Who is the actor?
        run: echo "Scheduled run by $ACTOR"
        env:
          ACTOR: ${{ github.actor }}
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images with docker-bake.hcl
        uses: docker/bake-action@v5
        with:
          files: ./docker-bake.hcl
          push: true
        env:
          IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'nightly' }}
